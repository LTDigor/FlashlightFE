plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.146'
}
version = providers.gradleProperty('mod_version').get()
group = 'com.ltdigor.bestflashlight'
base { archivesName = 'flashlight-fe' }
java.toolchain.languageVersion = JavaLanguageVersion.of(21)
sourceSets { smoke { compileClasspath += sourceSets.main.output; runtimeClasspath += sourceSets.main.output } }
configurations {
    smokeImplementation.extendsFrom implementation
    smokeRuntimeOnly.extendsFrom runtimeOnly
}
repositories {
    mavenCentral()
    maven { url = 'https://maven.blamejared.com'; content { includeGroup 'mezz.jei' } }
    maven { url = 'https://maven.theillusivec4.top'; content { includeGroup 'top.theillusivec4.curios' } }
    maven { url = 'https://www.cursemaven.com'; content { includeGroup 'curse.maven' } }
}
dependencies {
    compileOnly 'mezz.jei:jei-1.21.1-common-api:19.54.0.429'
    compileOnly 'top.theillusivec4.curios:curios-neoforge:9.5.1+1.21.1'
    smokeImplementation 'top.theillusivec4.curios:curios-neoforge:9.5.1+1.21.1'
    testRuntimeOnly 'top.theillusivec4.curios:curios-neoforge:9.5.1+1.21.1'
    smokeImplementation 'curse.maven:immersive-engineering-231951:6733669'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
// Local real LDL fixture; optional and confined to the beam smoke launch.
configurations { beamSmokeRuntime }
if (providers.gradleProperty('beamSmokeModDir').isPresent()) {
    dependencies.add('beamSmokeRuntime', fileTree(providers.gradleProperty('beamSmokeModDir').get()) {
        include 'lambdynamiclights-*.jar'
    })
}
neoForge {
    version = '21.1.249'
    addModdingDependenciesTo sourceSets.smoke
    mods {
        bestflashlight { sourceSet sourceSets.main }
        bestflashlightSmoke { sourceSet sourceSets.main; sourceSet sourceSets.smoke }
    }
    runs {
        client { client(); loadedMods = [mods.bestflashlight] }
        server { server(); sourceSet = sourceSets.main; loadedMods = [mods.bestflashlight]; programArgument '--nogui'; gameDirectory = file('run-server') }
        gameTestServer { type = 'gameTestServer'; sourceSet = sourceSets.smoke; loadedMods = [mods.bestflashlightSmoke]; gameDirectory = file('run-gametest') }
        clientSmoke { client(); sourceSet = sourceSets.smoke; loadedMods = [mods.bestflashlightSmoke]; gameDirectory = file('run-client-smoke'); systemProperty 'bestflashlight.smoke', 'true'; programArgument '--username'; programArgument 'FlashlightSmoke' }
        beamClientSmoke {
            client(); sourceSet = sourceSets.smoke; loadedMods = [mods.bestflashlightSmoke]
            gameDirectory = file('run-beam-smoke')
            systemProperty 'bestflashlight.beamSmoke', 'true'
            systemProperty 'bestflashlight.beamDiagnostics', 'true'
            systemProperty 'bestflashlight.beamSmoke.baseline', providers.gradleProperty('beamSmokeBaseline').getOrElse('false')
            programArgument '--username'; programArgument 'BeamSmoke'
        }
        clientReloadSmoke { client(); sourceSet = sourceSets.smoke; loadedMods = [mods.bestflashlightSmoke]; gameDirectory = file('run-client-smoke'); systemProperty 'bestflashlight.smoke', 'true'; systemProperty 'bestflashlight.smoke.reload', 'true'; programArgument '--username'; programArgument 'FlashlightSmoke' }
        multiplayerServer { server(); sourceSet = sourceSets.smoke; loadedMods = [mods.bestflashlightSmoke]; gameDirectory = file('run-multiplayer-server'); systemProperty 'bestflashlight.multiplayer.server', 'true'; programArgument '--nogui' }
        multiplayerA { client(); sourceSet = sourceSets.smoke; loadedMods = [mods.bestflashlightSmoke]; gameDirectory = file('run-client-a'); systemProperty 'bestflashlight.multiplayer.client', 'true'; programArgument '--username'; programArgument 'FlashlightA' }
        multiplayerB { client(); sourceSet = sourceSets.smoke; loadedMods = [mods.bestflashlightSmoke]; gameDirectory = file('run-client-b'); systemProperty 'bestflashlight.multiplayer.client', 'true'; programArgument '--username'; programArgument 'FlashlightB' }
        configureEach { systemProperty 'neoforge.enabledGameTestNamespaces', 'bestflashlight'; logLevel = org.slf4j.event.Level.INFO }
    }
    unitTest { enable(); testedMod = mods.bestflashlightSmoke }
}
tasks.named('test', Test) { useJUnitPlatform() }

// This run directory is disposable. Skip first-run accessibility onboarding so smoke can reach TitleScreen.
['runClientSmoke', 'runClientReloadSmoke'].each { taskName ->
    tasks.named(taskName) {
        doFirst {
            def options = file('run-client-smoke/options.txt')
            def keys = ['onboardAccessibility:', 'pauseOnLostFocus:']
            def existing = options.exists() ? options.readLines().findAll { line -> !keys.any { line.startsWith(it) } } : []
            options.parentFile.mkdirs()
            options.text = (existing + ['onboardAccessibility:false', 'pauseOnLostFocus:false']).join(System.lineSeparator()) + System.lineSeparator()
        }
    }
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
tasks.withType(AbstractArchiveTask).configureEach { preserveFileTimestamps = false; reproducibleFileOrder = true }
tasks.named('jar', Jar) { from('LICENSE'); from('NOTICE'); manifest { attributes 'Implementation-Version': project.version } }

// Export launches so the dedicated server and two clients can run concurrently
// without holding one Gradle build open while starting another.
tasks.register('prepareMultiplayerSmoke') {
    dependsOn 'smokeClasses', 'prepareMultiplayerServerRun', 'prepareMultiplayerARun', 'prepareMultiplayerBRun'
    doLast {
        def javaPath = javaToolchains.launcherFor(java.toolchain).get().executablePath.asFile.absolutePath
        ['multiplayerServer', 'multiplayerA', 'multiplayerB'].each { name ->
            def runTask = tasks.named('run' + name.capitalize()).get()
            def command = [javaPath, '-Xmx2G', '-cp', runTask.classpathProvider.asPath] + runTask.allJvmArgs + runTask.args
            file("build/${name}-command.json").text = groovy.json.JsonOutput.toJson(command)
        }
    }
}

tasks.named('processResources', ProcessResources) {
    inputs.property 'mod_version', project.version
    filesMatching('META-INF/neoforge.mods.toml') {
        expand mod_version: project.version
    }
}

// No user-instance files are changed. The isolated world and captures are ignored by Git.
tasks.register('setupBeamSmoke') {
    doLast {
        if (configurations.beamSmokeRuntime.files.size() != 1) {
            throw new GradleException('Set -PbeamSmokeModDir to a directory containing exactly one real lambdynamiclights-*.jar')
        }
        delete fileTree('run-beam-smoke/mods') { include 'lambdynamiclights-*.jar' }
        copy { from configurations.beamSmokeRuntime; into file('run-beam-smoke/mods') }
        def options = file('run-beam-smoke/options.txt')
        options.parentFile.mkdirs()
        options.text = 'onboardAccessibility:false\npauseOnLostFocus:false\nrenderDistance:6\nsimulationDistance:5\nmaxFps:120\n'
    }
}

tasks.named('runBeamClientSmoke') { dependsOn 'setupBeamSmoke' }
tasks.register('prepareBeamSmoke') {
    dependsOn 'smokeClasses', 'prepareBeamClientSmokeRun', 'setupBeamSmoke'
    doLast {
        def javaPath = javaToolchains.launcherFor(java.toolchain).get().executablePath.asFile.absolutePath
        def runTask = tasks.named('runBeamClientSmoke').get()
        def command = [javaPath, '-Xmx2G', '-cp', runTask.classpathProvider.asPath] + runTask.allJvmArgs + runTask.args
        file('build/beamClientSmoke-command.json').text = groovy.json.JsonOutput.toJson(command)
    }
}
