name: Build and test

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

# Serialize checks for each branch. Publishing is intentionally disabled.
concurrency:
  group: flashlight-fe-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Test release safeguards (including private/disabled builds)
        run: python3 -m unittest discover -s scripts -p '*_test.py'
      - name: Build and compile smoke tests
        run: ./gradlew --no-daemon build smokeClasses
      - name: Run server GameTests
        run: ./gradlew --no-daemon runGameTestServer
      - name: Validate version, changelog, metadata and production JAR
        run: python3 scripts/release.py validate
