name: Review verification

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: review-verification-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Record exact tested source
        run: |
          mkdir -p verification
          git rev-parse HEAD > verification/COMMIT
          git archive --format=tar HEAD -o verification/source.tar
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verification-source
          path: verification/
          retention-days: 7
